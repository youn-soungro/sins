<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>디자인재성 출퇴근</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif;
    background:linear-gradient(180deg,#1a37b5,#1c2e72);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .box{width:100%;max-width:420px;text-align:center;color:#fff}
  h1{font-size:28px;font-weight:900;letter-spacing:-.5px}
  p.sub{margin-top:8px;font-size:15px;color:#bcd1ff}
  a.btn{
    display:block;margin-top:20px;padding:26px 20px;border-radius:20px;
    font-size:22px;font-weight:900;text-decoration:none;
    box-shadow:0 8px 24px rgba(0,0,0,.25);
  }
  a.emp{background:#fff;color:#1a37b5}
  a.adm{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.45);font-size:17px;padding:18px 20px}
  .tip{margin-top:24px;font-size:13px;line-height:1.7;color:#9eb8ff}
</style>
</head>
<body>
  <div class="box">
    <h1>디자인재성</h1>
    <p class="sub">직원 출퇴근 · 일당 관리</p>

    <!-- ▼▼▼ 아래 두 줄의 주소를 배포받은 실제 주소로 바꿔주세요 ▼▼▼ -->
    <a class="btn emp" href="https://주소를-여기에-입력.vercel.app/employee/login">출퇴근 하기</a>
    <a class="btn adm" href="https://주소를-여기에-입력.vercel.app/login">관리자 로그인</a>
    <!-- ▲▲▲ 예: https://sins-attendance.vercel.app/employee/login ▲▲▲ -->

    <p class="tip">
      휴대폰에서 이 화면을 <b>홈 화면에 추가</b>해 두면<br>
      앱처럼 바로 열 수 있습니다.
    </p>
  </div>
</body>
</html>
